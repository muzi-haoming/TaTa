# embedding model configuration
embedding_model:
  base_url: "http://192.168.31.107:12310"
  embed_url: "/embed"
  drop_collection_url: "/drop_collection"
  health_url: "/health"
  dimension: 512



# Rerank model configuration
rerank_model:
  base_url: "http://192.168.31.107:12311"
  rerank_url: "/rerank"
  health_url: "/health"



# Milvus configuration
milvus:
  base_url: "http://192.168.31.107:19530"
  limit: 10
  



# Text splitting configuration
text_splitter:
  chunk_size: 300
  chunk_overlap: 30
  separators: ["---", "\n\n", "\n", "。", "！", "？", "；", "，", "、", ". ", "! ", "? ", "; ", ", ", " ", ""]



# LLM configuration
lite_llm:
  model: "gpt-5.6-luna"
  model_provider: "openai"
  use_responses_api: true
  temperature: 0.7
