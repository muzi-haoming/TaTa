medium_llm:
  model: "gpt-5.6-luna"
  model_provider: "openai"
  use_responses_api: true
  temperature: 0.7



# RAG configuration
rag:
  collection_name:
    background_info: "background_info_collection"
  bm25_index_path: "data/bm25_index.pkl"
  bm25_top_k: 5
  vector_top_k: 5
  rerank_top_k: 5