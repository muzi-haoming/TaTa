# TaTa NPC Generation System Configuration
# ==========================================

# Google Cloud Platform 配置
google_cloud:
  project: "tata-482008"
  location: "us-central1"

# AI 模型配置
models:
  # LangChain chat model
  chat_model: "google_vertexai:gemini-2.5-flash"
  # LangChain image model (支持图片输入/输出)
  image_model: "google_vertexai:gemini-2.5-flash-image"
  # Google Imagen model
  imagen_model: "imagen-4.0-generate-001"
  imagen_number_of_images: 1
  # Embedding model
  embedding_model: "text-embedding-004"

# 向量数据库配置
vector_store:
  collection_name: "npc_lore_collection"
  persist_directory: "data/chroma_db"

# 检索器配置
retriever:
  search_type: "similarity_score_threshold"
  search_kwargs:
    k: 10
    score_threshold: 0.2

# 日志配置
logging:
  console:
    level: "INFO"
    colorize: true
    format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  file:
    directory: "data/log"
    runtime:
      filename_pattern: "runtime_{time:YYYY-MM-DD}.log"
      rotation: "00:00"
      retention: "10 days"
      level: "DEBUG"
      encoding: "utf-8"
      enqueue: true
    error:
      filename_pattern: "error_{time:YYYY-MM-DD}.log"
      rotation: "10 MB"
      retention: "30 days"
      level: "ERROR"
      encoding: "utf-8"

# 数据目录配置
paths:
  npc_generation_data: "data/npc_generation"
  worldview_file: "worldview.txt"
  model_style_file: "model_style.txt"

# UI 配置
ui:
  default_thread_id: "959"
  stream_delay: 0.01